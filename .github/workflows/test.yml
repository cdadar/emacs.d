name: CI

on:
  pull_request:
  push:
    paths-ignore:
    - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      matrix:
        emacs_version:
          - 29.1
          - 29.3
          - 29.4
          - 30.1
          - 30.2
        experimental: [false]
        include:
          - emacs_version: snapshot
            experimental: true
    steps:
    - uses: purcell/setup-emacs@master
      with:
        version: ${{ matrix.emacs_version }}

    - uses: actions/checkout@v7
    - name: Check startup
      run: |
        # .gitmodules may not exist (it is only there while a submodule is);
        # rewriting it unconditionally fails the step with sed's exit code 2
        # before the config is ever loaded.
        if [ -f .gitmodules ]; then
          sed -i 's/git@github.com:/https:\/\/github.com\//' .gitmodules
        fi
        git submodule update --init --recursive
        ./test-startup.sh
    - name: Test init-lsp
      run:  ./test-init-lsp.sh
